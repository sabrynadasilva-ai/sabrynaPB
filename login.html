<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Entrar | StudyFlow</title>

<link rel="icon" type="image/png" href="favicon.png">

<link rel="stylesheet" href="style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body class="login-page">

<div class="login-container">

    <!-- PAINEL VERDE -->

    <div class="login-left">

        <div class="logo-login">
            🎓 <span>StudyFlow</span>
        </div>

        <h1>Bem-vindo<br>de volta! 👋</h1>

        <p>
            Faça login para acessar sua conta
            e continuar organizando seus estudos.
        </p>

        <div class="login-ilustracao">
            📚
        </div>

    </div>


    <!-- FORMULÁRIO -->

    <div class="login-right">

        <h2>Entrar</h2>

        <p class="login-subtitulo">
            Acesse sua conta para continuar.
        </p>

        <form id="loginForm">

            <label for="email">E-mail</label>

            <input
                type="email"
                id="email"
                placeholder="seu@email.com"
                required
            >


            <label for="senha">Senha</label>

            <div class="senha-box">

                <input
                    type="password"
                    id="senha"
                    placeholder="Digite sua senha"
                    required
                >

                <button
                    type="button"
                    class="mostrar-senha"
                    onclick="mostrarSenha()"
                    aria-label="Mostrar senha"
                >
                    <i class="fa-solid fa-eye"></i>
                </button>

            </div>


            <div class="opcoes-login">

                <label class="lembrar">
                    <input type="checkbox">
                    <span>Lembrar de mim</span>
                </label>

                <a href="#" onclick="esqueciSenha()">
                    Esqueceu sua senha?
                </a>

            </div>


            <button type="submit" class="btn-login">
                Entrar
            </button>

        </form>


        <div class="linha">
            <span>ou continue com</span>
        </div>


        <!-- LOGIN SOCIAL -->

        <div class="social-login">

            <button class="btn-social" onclick="loginGoogle()">
                <i class="fa-brands fa-google"></i>
                <span>Continuar com Google</span>
            </button>

            <button class="btn-social" onclick="loginFacebook()">
                <i class="fa-brands fa-facebook"></i>
                <span>Continuar com Facebook</span>
            </button>

            <button class="btn-social" onclick="loginNumero()">
                <i class="fa-solid fa-mobile-screen-button"></i>
                <span>Continuar com número</span>
            </button>

        </div>


        <p class="criar">
            Não possui uma conta?
            <a href="cadastro.html">Criar Conta</a>
        </p>

        <a href="index.html" class="voltar">
            ← Voltar ao início
        </a>

    </div>

</div>


<script>

function mostrarSenha(){

    const senha = document.getElementById("senha");
    const icone = document.querySelector(".mostrar-senha i");

    if(senha.type === "password"){

        senha.type = "text";

        icone.classList.remove("fa-eye");
        icone.classList.add("fa-eye-slash");

    }else{

        senha.type = "password";

        icone.classList.remove("fa-eye-slash");
        icone.classList.add("fa-eye");

    }

}


function esqueciSenha(){

    alert("A recuperação de senha será adicionada em breve!");

}


function loginGoogle(){

    alert("Login com Google será configurado em breve!");

}


function loginFacebook(){

    alert("Login com Facebook será configurado em breve!");

}


function loginNumero(){

    alert("Login com número será configurado em breve!");

}


document.getElementById("loginForm").addEventListener("submit", function(event){

    event.preventDefault();

    window.location.href = "dashboard.html";

});

</script>

</body>
 </html>
